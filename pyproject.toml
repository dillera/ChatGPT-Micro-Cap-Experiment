[project]
name = "microcap-trading-bot"
version = "0.1.0"
description = "Autonomous micro-cap AI trading bot with multi-LLM consensus"
requires-python = ">=3.11"
dependencies = [
    "tastytrade>=12.2.0",
    "openai>=2.29.0",
    "anthropic>=0.86.0",
    "pydantic-settings>=2.9.0",
    "loguru>=0.7.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "yfinance>=0.2.60",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "pandas-datareader>=0.10.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.0",
    "streamlit>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
